<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Exploit Host</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #0070d1;
            --accent-hover: #0056a3;
            --text-color: #ffffff;
            --subtext-color: #aaa;
            --success-color: #4caf50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: var(--text-color);
            font-size: 1.8rem;
        }

        p {
            color: var(--subtext-color);
            font-size: 0.95rem;
        }

        #status-box {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background-color: rgba(255,255,255,0.05);
            font-weight: bold;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .offline-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 20px;
            background-color: rgba(76, 175, 80, 0.2);
            color: var(--success-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مضيف ثغرات PlayStation 4</h1>
        <p>صفحة التعديل السريعة لمشغلات PS4 (تدعم الكاش والأوفلاين)</p>

        <div id="status-box">جاري فحص حالة الكاش...</div>

        <div class="btn-grid">
            <button class="btn" onclick="loadPayload('goldhen')">GoldHEN</button>
            <button class="btn" onclick="loadPayload('hen')">HEN</button>
            <button class="btn" onclick="loadPayload('app2usb')">App2USB</button>
            <button class="btn" onclick="loadPayload('dumper')">Game Dumper</button>
        </div>

        <div id="offline-status" class="offline-badge" style="display: none;">
            ✓ الصفحات والمطوّرات محفوظة للاستخدام بدون إنترنت
        </div>
    </div>

    <script>
        const statusBox = document.getElementById('status-box');
        const offlineBadge = document.getElementById('offline-status');

        // تسجيل الـ Service Worker لتفعيل الكاش والأوفلاين
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // إنشاء كود Service Worker ديناميكيًا من خلال Blob
                const swCode = `
                    const CACHE_NAME = 'ps4-exploit-v1';
                    const ASSETS = [
                        './',
                        './index.html'
                    ];

                    self.addEventListener('install', (e) => {
                        e.waitUntil(
                            caches.open(CACHE_NAME).then((cache) => {
                                return cache.addAll(ASSETS);
                            }).then(() => self.skipWaiting())
                        );
                    });

                    self.addEventListener('activate', (e) => {
                        e.waitUntil(self.clients.claim());
                    });

                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            caches.match(e.request).then((cachedResponse) => {
                                return cachedResponse || fetch(e.request);
                            })
                        );
                    });
                `;

                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);

                navigator.serviceWorker.register(swUrl)
                    .then((reg) => {
                        statusBox.innerText = 'جاهز للاستخدام! تم حفظ الكاش ليعمل بدون إنترنت.';
                        offlineBadge.style.display = 'inline-block';
                    })
                    .catch((err) => {
                        statusBox.innerText = 'جاهز (لم يتم تفعيل الكاش التلقائي).';
                        console.error('Service Worker Failed:', err);
                    });
            });
        } else {
            statusBox.innerText = 'متصفحك لا يدعم تخزين الكاش التلقائي.';
        }

        // دالة تشغيل الثغرات (ضع أكواد الثغرة الخاصة بك هنا)
        function loadPayload(name) {
            statusBox.innerText = 'جاري تحميل ' + name + '... برجاء الانتظار';
            
            // هنا يتم استدعاء الملفات الخاصة بكل payload حسب مشروعك
            setTimeout(() => {
                statusBox.innerText = 'تم إرسال ' + name + ' بنجاح!';
            }, 1000);
        }
    </script>
</body>
</html>
